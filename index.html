<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxedwine App Testing Loader</title>
<link rel="stylesheet" href="boxedwine.css">
<style>
body { margin: 0; background: #333; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
#drop-zone { border: 3px dashed #666; padding: 30px; text-align: center; background: #222; margin-bottom: 20px; border-radius: 8px; width: 800px; box-sizing: border-box; }
#canvas { border: 2px solid #555; background: black; display: none; }
</style>
</head>
<body>

<div id="drop-zone">
<h3>Boxedwine Local Test Utility</h3>
<p>Drag and drop your <strong>UNDERTALE.zip</strong> package directly inside this dashed box to scan its executable pathways.</p>
</div>

<canvas id="canvas" width="800" height="600" oncontextmenu="event.preventDefault()"></canvas>

<script>
// Setup base test parameters targeting the cloud distribution network
var Config = {
arguments: ["c:\\Undertale\\UNDERTALE.exe"],
canvas: document.getElementById('canvas'),
baseUrl: "https://boxedwine.org",
wasmUrl: "https://boxedwine.orgboxedwine.wasm"
};

// Wire up drag-and-drop mechanics to intercept file packages locally
var dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.style.borderColor = '#00ff00'; });
dropZone.addEventListener('dragleave', function(e) { e.preventDefault(); dropZone.style.borderColor = '#666'; });
dropZone.addEventListener('drop', function(e) {
e.preventDefault();
dropZone.style.borderColor = '#666';
var files = e.dataTransfer.files;
if(files.length > 0) {
alert("File dropped successfully! Upload this test.html to your live public website URL to test it without local browser cross-origin policy blocks.");
}
});
</script>
</body>
</html>
