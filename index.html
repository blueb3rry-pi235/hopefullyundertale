<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undertale Web Edition</title>
<link rel="stylesheet" href="boxedwine.css">
<style>
body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
#canvas { display: none; border: 3px solid #333; image-rendering: pixelated; }
#status { font-size: 20px; cursor: pointer; text-align: center; padding: 20px; border: 2px dashed #444; border-radius: 8px; background: #111; }
</style>
</head>
<body>

<div id="status" onclick="startEmulator()">Click Anywhere on this Screen to Load Undertale</div>
<canvas id="canvas" width="800" height="600" oncontextmenu="event.preventDefault()"></canvas>

<script>
// Consolidated configuration mapping to your local repository assets
var Config = {
workingDirectory: "c:\\Undertale",
arguments: ["c:\\Undertale\\UNDERTALE.exe"],
canvas: document.getElementById('canvas'),

// Your active direct Dropbox stream link
zipUrl: "https://www.dropbox.com/scl/fi/0hirekpvmmy81jpn9vgei/UNDERTALE.zip?rlkey=orlz81z7u7o80fr0ncspdrhvx&st=v0lwchkb&dl=1",

// Corrected to look inside your own GitHub repo directory for the assets
baseUrl: "",
wasmUrl: "boxedwine.wasm"
};

function startEmulator() {
var statusDiv = document.getElementById('status');
statusDiv.innerHTML = "Downloading & Unpacking Undertale from Dropbox... Please wait.";
statusDiv.style.pointerEvents = "none"; // Prevent multiple clicks

// Inject your local script into the webpage context
var script = document.createElement('script');
script.src = "boxedwine-shell.js";

script.onload = function() {
// Reveal the canvas interface frame dynamically once setup finishes
setTimeout(function() {
statusDiv.style.display = 'none';
document.getElementById('canvas').style.display = 'block';
}, 4000);
};

document.body.appendChild(script);
}
</script>
</body>
</html>
