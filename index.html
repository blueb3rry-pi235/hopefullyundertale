<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undertale Web Edition</title>
<link rel="stylesheet" href="boxedwine.css">
</head>
<body>
<div id="loading" style="color: white; text-align: center; margin-top: 20%;">Loading Emulator Brain...</div>
<canvas id="canvas" style="display:none;" width="800" height="600" oncontextmenu="event.preventDefault()"></canvas>

<script>
var Config = {
// Corrected path to target the Undertale folder inside your zip container
arguments: ["Undertale/UNDERTALE.exe"],
canvas: document.getElementById('canvas'),

// Your real Dropbox direct download link
zipUrl: "https://dropbox.com",

// Uses global CDN servers to stream the core emulator files
baseUrl: "https://boxedwine.org",
wasmUrl: "https://boxedwine.orgboxedwine.wasm"
};

// Reveal the canvas once the engine loads
window.addEventListener('load', function() {
setTimeout(function() {
document.getElementById('loading').style.display = 'none';
document.getElementById('canvas').style.display = 'block';
}, 3000);
});
</script>
<script src="https://boxedwine.orgboxedwine.js"></script>
</body>
</html>
